name: Create Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create plugin package
        run: |
          mkdir -p build
          # Only include files needed for Joomla installation
          # Documentation files (CLAUDE.md, README.md, CHANGELOG.md, update.xml) are excluded
          zip -r build/plg_system_googletagmanager-${{ steps.tag.outputs.tag }}.zip \
            googletagmanager.xml \
            services/ \
            src/ \
            language/ \
            -x "*.git*" "*.DS_Store"

      - name: Generate release notes
        id: changelog
        run: |
          # Extract the section for this tag from CHANGELOG.md, write to a separate file
          # so CHANGELOG.md itself remains intact for later steps
          awk "/^## \[${{ steps.tag.outputs.tag }}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release_notes.md

          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "1. Download the \`plg_system_googletagmanager-${{ steps.tag.outputs.tag }}.zip\` file below" >> release_notes.md
          echo "2. In Joomla administrator, go to Extensions → Manage → Install" >> release_notes.md
          echo "3. Upload and install the package" >> release_notes.md
          echo "4. Enable the plugin in System → Plugins" >> release_notes.md
          echo "5. Configure your GTM Container ID" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          files: |
            build/plg_system_googletagmanager-${{ steps.tag.outputs.tag }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout main branch
        run: |
          git fetch origin main
          git checkout main

      - name: Update update.xml
        run: |
          # Update version number (first occurrence only, so old entries are not overwritten)
          sed -i "0,/<version>/s|<version>.*</version>|<version>${{ steps.tag.outputs.tag }}</version>|" update.xml

          # Update download URL (first occurrence only, preserve .zip extension)
          sed -i "0,/downloadurl/s|releases/download/[^/]*/plg_system_googletagmanager-[^<]*|releases/download/${{ steps.tag.outputs.tag }}/plg_system_googletagmanager-${{ steps.tag.outputs.tag }}.zip|" update.xml

      - name: Commit and push update.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.xml
          git commit -m "Update update.xml for version ${{ steps.tag.outputs.tag }}" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
