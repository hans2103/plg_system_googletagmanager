; Basic fieldset
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CONTAINER_ID_LABEL="Container ID"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CONTAINER_ID_DESC="Enter your GTM Container Public ID (GTM-XXXX)"

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_SERVER_SIDE_TAGGING_LABEL="Use server-side tagging?"

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_SERVER_SIDE_NOTE_DESC="With server-side tagging, the GTM JavaScript tag still loads in the visitor's browser, but tracking requests are sent to your own server-side GTM container instead of directly to Google's servers. Your server then processes the data and forwards it to the configured destinations. This improves data accuracy and reduces reliance on browser-side tracking. <a href=_QQ_https://developers.google.com/tag-platform/tag-manager/server-side_QQ_ target=_QQ__blank_QQ_ rel=_QQ_noopener noreferrer_QQ_>Learn more about server-side tagging</a>"

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_SERVER_SIDE_DOMAIN_LABEL="Server-side GTM Domain"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_SERVER_SIDE_DOMAIN_DESC="Must match the <strong>Server Container URL</strong> configured in GTM Admin &rarr; Container Settings. Enter the full URL starting with https:// (e.g. https://sst.example.com). GTM scripts will be loaded from this domain instead of googletagmanager.com."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_SCRIPT_LOADER_URL_LABEL="Script Loader URL"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_SCRIPT_LOADER_URL_DESC="Optional. The base URL from which <code>gtm.js</code> is served when it differs from the sGTM domain above. Use this when your sGTM provider proxies the loader script through your own domain (e.g. Stape Custom Loader power-up with _QQ_Use original GTM code_QQ_ enabled). Example: https://example.com/mos &mdash; the noscript fallback always uses the sGTM domain above."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CUSTOM_LOADER_NOTE_DESC="<strong>Enhanced ad blocker protection</strong> &mdash; use this when your sGTM provider supports obfuscated loader scripts (e.g. Stape Custom Loader with _QQ_Enhanced ad blocker protection_QQ_ enabled). Enter the Container Identifier to let the plugin generate the obfuscated filename and query string automatically, or enter the filename and query string manually below."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_STAPE_LOADER_SCRIPT_LABEL="Stape Custom Loader Script"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_STAPE_LOADER_SCRIPT_DESC="Paste the complete code snippet generated by the Stape Custom Loader power-up here. You can paste either the raw JavaScript or the full snippet including <code>&lt;script&gt;</code> tags and HTML comments &mdash; both are handled automatically. When filled, this takes priority over all other loader settings (API fetch, Container Identifier, and Manual override fields below)."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CONTAINER_IDENTIFIER_LABEL="Container Identifier"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CONTAINER_IDENTIFIER_DESC="The container identifier provided by your sGTM provider (e.g. fjvqgtsh in Stape). The plugin uses this to generate the obfuscated script filename and query string automatically &mdash; no manual copy-paste needed. Leave empty if you enter the filename and params manually below."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_STAPE_API_KEY_LABEL="Stape API Key"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_STAPE_API_KEY_DESC="Optional. Your Stape Container API key or a personal API token, used to identify your container when calling Stape&rsquo;s API. When provided, the plugin fetches the exact obfuscated loader script directly from Stape&rsquo;s API instead of generating it locally. If left empty, the Container Identifier above is used instead. Find the key in Stape &rarr; Container Settings."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_COOKIE_KEEPER_LABEL="Cookie Keeper"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_COOKIE_KEEPER_DESC="Enable Safari ITP support via Stape&rsquo;s Cookie Keeper power-up. When enabled, Safari 16.4+ visitors load the GTM script via a <code>kp</code>-prefixed identifier. Stape&rsquo;s server detects this prefix and sets a server-side cookie with a 2-year expiry, bypassing Safari&rsquo;s ITP 7-day cap on JavaScript-set cookies. Requires a Container Identifier to be set above."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CUSTOM_LOADER_MANUAL_NOTE_DESC="<strong>Manual override</strong> &mdash; only fill in the two fields below if you want to paste the obfuscated values directly from the generated snippet. When filled in, these take priority over the Container Identifier above."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CUSTOM_SCRIPT_FILENAME_LABEL="Custom Script Filename"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CUSTOM_SCRIPT_FILENAME_DESC="The obfuscated JS filename from the generated snippet (e.g. 1afjvqgtsh.js). Both this field and Custom Script Params must be set together."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CUSTOM_SCRIPT_PARAMS_LABEL="Custom Script Params"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CUSTOM_SCRIPT_PARAMS_DESC="The obfuscated query string from the generated snippet (e.g. c1ky2=ARdJICU7...). Both this field and Custom Script Filename must be set together."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_SERVER_SIDE_PATH_NOTE_DESC="<strong>Path prefix &mdash; only needed in rare cases.</strong> Leave this empty for the standard sGTM setup. Only fill it in if your sGTM instance is configured to serve scripts from a sub-path (e.g. /gtm) instead of the domain root. This is <em>not</em> the same as a custom loader path configured inside a GTM tag."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_SERVER_SIDE_PATH_LABEL="Server-side GTM Path"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_SERVER_SIDE_PATH_DESC="Optional sub-path prefix (e.g. /gtm). Leave empty if your sGTM scripts are served from the domain root."

; Advanced fieldset
PLG_SYSTEM_GOOGLETAGMANAGER_FIELDSET_ADVANCED="Advanced"

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_GTM_ENVIRONMENTS_NOTE_DESC="GTM environments let you test a container version before publishing it live. Both fields below must be filled in together. Find the values in <strong>GTM Admin &rarr; Environments &rarr; Actions &rarr; Get snippet</strong> &mdash; copy the <code>gtm_auth</code> and <code>gtm_preview</code> query parameter values from the snippet URL. Leave both empty to use the published live container."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_GTM_AUTH_LABEL="GTM Environment Auth Token"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_GTM_AUTH_DESC="The gtm_auth token from the environment snippet URL (e.g. ABC123XYZ). Both this field and GTM Environment Name must be set together."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_GTM_PREVIEW_LABEL="GTM Environment Name"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_GTM_PREVIEW_DESC="The gtm_preview value from the environment snippet URL (e.g. env-2). Both this field and GTM Environment Auth Token must be set together."

; Consent banner fieldset
PLG_SYSTEM_GOOGLETAGMANAGER_FIELDSET_CONSENT_BANNER="Consent banner"

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_NATIVE_CONSENT_BANNER_LABEL="Render the consent banner natively?"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_NATIVE_CONSENT_BANNER_DESC="When enabled, this plugin renders and manages the cookie consent banner itself, independently of whether GTM's client-side script loads. When disabled (default), the plugin behaves exactly as before and assumes a banner is provided elsewhere (e.g. a Custom HTML tag inside the GTM container)."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_NATIVE_BANNER_NOTE_DESC="Remember to disable or remove any existing consent banner tag inside your GTM container when enabling this, to avoid showing two banners at once."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CONSENT_CATEGORY_MARKETING_LABEL="Show Marketing category?"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CONSENT_CATEGORY_MARKETING_DESC="Disable this if the site doesn't run any advertising/marketing tags, to avoid showing an irrelevant category to visitors."

PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CONSENT_EXPIRATION_DAYS_LABEL="Consent validity (days)"
PLG_SYSTEM_GOOGLETAGMANAGER_FIELD_CONSENT_EXPIRATION_DAYS_DESC="Number of days a visitor's consent choice remains valid before they are asked again. No fixed number of days is legally mandated; 365 is a common default."

; Consent banner content (generic default, overridable per site)
PLG_SYSTEM_GOOGLETAGMANAGER_CONSENT_BANNER_TEXT="This site uses cookies to understand how it's used. Choose which cookies you're OK with."
